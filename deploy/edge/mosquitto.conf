# -----------------------------------------------------------------------------
# Eclipse Mosquitto Configuration for Tactical MANET Mesh Emulation
# -----------------------------------------------------------------------------

# Port for standard MQTT TCP connections
listener 1883 0.0.0.0

# WebSocket listener for browser-based diagnostics
listener 9001 0.0.0.0
protocol websockets

# Open access within local container network (tactical mesh simulator)
allow_anonymous true

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Structured tactical logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

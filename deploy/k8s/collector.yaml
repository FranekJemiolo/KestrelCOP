apiVersion: apps/v1
kind: Deployment
metadata:
  name: kestrel-collector
  namespace: kestrel
  labels:
    app: kestrel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kestrel-collector
  template:
    metadata:
      labels:
        app: kestrel-collector
    spec:
      containers:
        - name: collector
          image: kestrel-collector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: MQTT_BROKER_URL
              value: "tcp://mosquitto.kestrel.svc.cluster.local:1883"
            - name: MQTT_TOPIC
              value: "tactical/kestrel/+/cot"
            - name: KAFKA_BROKERS
              value: "kafka.kestrel.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "tactical.cot.events"
            - name: POSTGIS_DSN
              value: "postgres://kestrel:kestrel_secure_tactical_pass@postgis.kestrel.svc.cluster.local:5432/kestrel_cop?sslmode=disable"
            - name: HTTP_ADDR
              value: ":8080"
            - name: METRICS_ADDR
              value: ":9090"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kestrel-collector
  namespace: kestrel
  labels:
    app: kestrel-collector
spec:
  type: ClusterIP
  ports:
    - port: 8080
      name: http
      targetPort: 8080
    - port: 9090
      name: metrics
      targetPort: 9090
  selector:
    app: kestrel-collector

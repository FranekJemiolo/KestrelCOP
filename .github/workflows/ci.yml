name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  edge-python:
    name: Edge Node (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Check
        run: uv run mypy edge_node tests

      - name: Run Tests (pytest)
        run: uv run pytest --maxfail=1 --disable-warnings -v

  backend-go:
    name: Command Collector Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Run Go Unit Tests
        run: cd backend && go test -v -race ./...

      - name: Build Collector Binary
        run: cd backend && CGO_ENABLED=0 go build -v -o /dev/null ./cmd/collector

  frontend-react:
    name: Tactical Dashboard (React PWA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Build PWA Bundle
        run: cd frontend && npm run build
